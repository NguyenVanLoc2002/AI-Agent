        h('span', { style: cap }, 'Khi có hệ thống: backend chỉ cập nhật quyền sau khi xác thực phê duyệt hợp lệ; mọi thay đổi quyền ghi audit.'))
      : h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
        R.err ? A('re', { tone: 'error', title: 'Chưa gửi được' }, 'Chọn quyền đề nghị và nhập lý do.') : null,
        NS.Select ? h(NS.Select, { label: 'Quyền đề nghị', required: true, placeholder: 'Chọn quyền', value: R.cap, error: R.err && !R.cap ? 'Bắt buộc' : undefined, options: (special ? ['Truy cập dữ liệu kinh doanh (đặc biệt)'] : (persona === 'restricted' ? ['Xem giá bán', 'Xem tồn kho', 'Lập / sửa báo giá', 'Tạo đơn nháp'] : []).concat(viewAll ? ['Quản trị người dùng'] : ['Xem nhật ký bộ phận', 'Quản trị người dùng'])).map((x) => ({ value: x, label: x })), onChange: (e) => this.setState({ req: { ...R, cap: e.target.value, err: R.err && !R.reason.trim() } }) }) : null,

    // ---------- E5 · Phiên ----------
    const sessionDialog = S.session === 'expired' && NS.Dialog ? h(NS.Dialog, { open: true, tone: 'warning', width: 480, title: S.sessionNote === 'max' ? 'Phiên đã đạt thời hạn tối đa 8 giờ' : 'Phiên đăng nhập đã hết hạn',

        btn({ iconLeft: 'shield-check', loading: S.reauth === 'running', disabled: S.reauth === 'running', onClick: () => this.relogin() }, S.reauth === 'running' ? 'Đang đăng nhập…' : 'Đăng nhập lại')) },
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10 } },
        S.sessionNote === 'inflight' ? A('if', { tone: 'warning', icon: 'circle-help', title: 'Có thao tác chưa rõ kết quả' }, 'Tạo đơn nháp cho BG-2026-0418 v2 đang xử lý khi phiên hết hạn. Không tự động tiếp tục hay tạo lại; sau khi đăng nhập, đối soát theo khóa BG-2026-0418-v2 (D57). Dữ liệu từ công cụ đang chạy chỉ trả về sau khi backend kiểm tra lại quyền.') : null,
        A('kp', { tone: 'neutral', title: 'Thay đổi chưa lưu' }, 'Được giữ trên thiết bị này cho tới khi đăng nhập lại (đề xuất). Không có thao tác ghi nào tự chạy lại.'),
        S.reauth === 'error' ? A('er', { tone: 'error', title: 'Đăng nhập không thành công' }, 'Mô phỏng. Thử lại hoặc liên hệ IT. Mã tham chiếu: AUTH-401.') : null,
        h('span', { style: cap }, pill('Q7 · ĐỀ XUẤT'), ' Tối đa 8 giờ · 30 phút không hoạt động · cấu hình, chưa có trong tài liệu gốc.'))) : null;
    const sessionWarn = S.session === 'warning' ? A('sw', { tone: 'warning', icon: 'clock', title: 'Phiên sẽ hết sau 5 phút nữa do không hoạt động', action: btn({ size: 'sm', variant: 'secondary', onClick: () => { this.setState({ session: 'ok' }); this.toast({ tone: 'success', title: 'Tiếp tục phiên', description: 'Đặt lại thời gian không hoạt động. Thời hạn tối đa 8 giờ vẫn giữ nguyên.' }); } }, 'Tiếp tục làm việc') }, h('span', null, 'Hết phiên sau 30 phút không hoạt động ', pill('Q7 · ĐỀ XUẤT'), '. Lưu thay đổi đang dở.')) : null;

    const L = S.login;
    const loginLayer = S.session === 'login' ? h('div', { style: { position: 'absolute', inset: 0, zIndex: 70, background: 'var(--bg-app)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 } },
      h('div', { style: { width: 400, maxWidth: '100%', display: 'flex', flexDirection: 'column', gap: 16, padding: 28, background: 'var(--bg-surface)', border: '1px solid var(--border-card)', borderRadius: 16, boxShadow: 'var(--shadow-md)' } },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: 4 } }, h('span', { style: { font: '700 20px/1.3 var(--font-sans)', color: 'var(--text-primary)' } }, 'AutoParts Agent'), h('span', { style: cap }, 'Đăng nhập bằng tài khoản nhân viên nội bộ')),
        L.err === 'bad' ? A('lb', { tone: 'error', title: 'Tài khoản hoặc mật khẩu không đúng' }, 'Không nói rõ trường nào sai. Sai nhiều lần sẽ tạm khóa (ngưỡng đề xuất).') : null,
        L.err === 'locked' ? A('ll', { tone: 'error', title: 'Tài khoản đang tạm khóa' }, 'Thử lại sau 15 phút (đề xuất) hoặc liên hệ quản lý trực tiếp / IT. Mã tham chiếu: AUTH-423.') : null,
        NS.Input ? h(NS.Input, { label: 'Tài khoản', placeholder: 'ten@apas.example', value: L.email, error: L.err === 'empty' && !L.email ? 'Bắt buộc' : undefined, onChange: (e) => this.setState({ login: { ...L, email: e.target.value, err: null } }) }) : null,
        NS.Input ? h(NS.Input, { label: 'Mật khẩu', type: 'password', value: L.pw, error: L.err === 'empty' && !L.pw ? 'Bắt buộc' : undefined, onChange: (e) => this.setState({ login: { ...L, pw: e.target.value, err: null } }), onKeyDown: (e) => { if (e.key === 'Enter') this.doLogin(); } }) : null,
        btn({ loading: L.busy, disabled: L.busy, onClick: () => this.doLogin(), style: { width: '100%' } }, L.busy ? 'Đang xác thực…' : 'Đăng nhập'),
        h('span', { style: cap }, 'Không tự đăng ký tài khoản. Quên mật khẩu: liên hệ quản lý trực tiếp / IT (quy trình đặt lại chưa thiết kế). SSO: chờ xác minh hệ thống danh tính. ', pill('Q7 · ĐỀ XUẤT')))) : null;

    // ---------- shell ----------
    const collapsed = S.col !== null ? S.col : narrow;
    const sections = [{ items: admin || auditor ? [{ key: 'dashboard', label: 'Tổng quan', icon: 'layout-dashboard' }, { key: 'audit', label: admin ? 'Nhật ký kỹ thuật' : 'Hoạt động', icon: 'history' }] : [
      { key: 'dashboard', label: 'Tổng quan', icon: 'layout-dashboard' }, { key: 'lookup', label: 'Tra cứu phụ tùng', icon: 'search' },
      { key: 'quote', label: 'Báo giá', icon: 'file-text' }, { key: 'orders', label: 'Đơn hàng nháp', icon: 'package' }, { key: 'audit', label: 'Hoạt động', icon: 'history' }] }];
    const navKey = S.route === 'audit' ? 'audit' : S.route === 'dashboard' ? 'dashboard' : null;
    const crumbs = [{ label: { dashboard: 'Tổng quan', audit: admin ? 'Nhật ký kỹ thuật' : 'Hoạt động', profile: 'Hồ sơ cá nhân', denied: 'Không có quyền' }[S.route] }];
    const page = S.route === 'dashboard' ? dashNode() : S.route === 'audit' ? auditNode() : S.route === 'profile' ? profileNode() : deniedNode('AUTH-403-AD', 'Quản trị người dùng');
    const main = h(React.Fragment, null, sessionWarn, page, reqDialog);
    return {
      rootRef: this.rootRef, sections, navKey, collapsed,
      sidebarFooter: collapsed ? null : h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, ...cap } }, h('span', { style: { width: 8, height: 8, borderRadius: '50%', background: erp === 'fresh' ? 'var(--status-success)' : 'var(--status-error)' } }), erp === 'fresh' ? 'ERP mô phỏng · đã kết nối' : 'ERP mô phỏng · không khả dụng'),
      crumbs, user: { name: 'Nguyễn Minh Anh', role: ROLE + ' (mô phỏng)', initials: 'MA' },
      headerActions: NS.IconButton ? h(React.Fragment, null, h(NS.IconButton, { icon: 'bell', label: 'Thông báo', onClick: () => other('Thông báo (Batch D)') }),
        h(NS.IconButton, { icon: 'user', label: 'Hồ sơ cá nhân', active: S.route === 'profile', onClick: () => go('profile') })) : null,
      headerSearch: () => other('Tìm nhanh (Workflow A)'),
      simBanner, mainNode: main, sessionLayer: h(React.Fragment, null, sessionDialog, loginLayer), panelOpen: false, panelPos: 'relative', panelShadow: 'none', panelKey: () => {}, panelContext: '', aiStatus: 'online', threadNode: null, composerNode: null, closePanel: () => {},
      toasts: S.toasts.map((t) => ({ ...t, close: () => this.setState({ toasts: this.state.toasts.filter((x) => x.id !== t.id) }) })),
      toggleSidebar: () => this.setState({ col: !collapsed }),
      selectNav: (k) => { if (k === 'dashboard' || k === 'audit') go(k, { open: null, kind: 'all' }); else other({ lookup: 'Tra cứu phụ tùng', quote: 'Báo giá', orders: 'Đơn hàng nháp' }[k]); },
    };
  }
