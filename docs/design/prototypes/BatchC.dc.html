      sidebarFooter: collapsed ? null : h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, ...cap } }, h('span', { style: { width: 8, height: 8, borderRadius: '50%', background: erp === 'fresh' ? 'var(--status-success)' : 'var(--status-error)' } }), erp === 'fresh' ? 'ERP mô phỏng · đã kết nối' : 'ERP mô phỏng · không khả dụng'),
      crumbs, user: { name: 'Nguyễn Minh Anh', role: { sales: 'Nhân viên kinh doanh', restricted: 'Nhân viên hạn chế', supervisor: 'Giám sát kinh doanh', admin: 'Quản trị hệ thống' }[persona] + ' (mô phỏng)', initials: 'MA' },
      headerActions: NS.IconButton ? h(React.Fragment, null, h(NS.IconButton, { icon: 'bell', label: 'Thông báo (chưa thiết kế)', disabled: true }), h(NS.IconButton, { icon: 'circle-help', label: 'Trợ giúp (chưa thiết kế)', disabled: true }),
        noAccess ? null : h(NS.IconButton, { icon: 'sparkles', label: panelOpen ? 'Đóng Trợ lý AI' : 'Mở Trợ lý AI', active: panelOpen, onClick: () => this.setState({ panel: !panelOpen }) })) : null,
      headerSearch: () => this.toast({ tone: 'info', title: 'Tìm nhanh thuộc Workflow A', description: 'Ô tìm trên header chưa có hành vi trong bản mô phỏng.' }),
      simBanner, mainNode: main, panelOpen: panelOpen && !noAccess, panelPos: overlay ? 'absolute' : 'relative', panelShadow: overlay ? 'var(--shadow-lg)' : 'none',
      panelKey: (e) => { if (e.key === 'Escape') { e.stopPropagation(); this.setState({ panel: false }); } },
      panelContext: ctxLabel, aiStatus: 'online', threadNode, composerNode, closePanel: () => this.setState({ panel: false }),
      toasts: S.toasts.map((t) => ({ ...t, close: () => this.setState({ toasts: this.state.toasts.filter((x) => x.id !== t.id) }) })),
      toggleSidebar: () => this.setState({ col: !collapsed }),
      selectNav: (k) => { if (k === 'quote') go('list'); else this.toast({ tone: 'info', title: k === 'lookup' ? 'Tra cứu phụ tùng thuộc Workflow A' : 'Ngoài phạm vi Batch C', description: k === 'lookup' ? 'Xem prototype Workflow A.' : 'Màn hình này chưa được thiết kế.' }); },
    };
  }
}
</script>
