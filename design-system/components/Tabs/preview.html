<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Tabs — preview</title>
<style>body{margin:0;padding:20px;background:var(--bg-surface)}.lbl{font:var(--type-overline);color:var(--text-secondary);text-transform:uppercase;letter-spacing:var(--tracking-caps);margin-bottom:8px}</style>
</head>
<body>
<div id="root"></div>
<script>
const {
  Tabs
} = window.AutoPartsAgentDesignSystem_aa8546;
const R = p => React.createElement("div", {
  style: {
    display: 'flex',
    gap: p.gap || 10,
    alignItems: p.align || 'center',
    flexWrap: 'wrap',
    ...p.style
  }
}, p.children);
const L = ({
  t
}) => React.createElement("div", {
  className: "lbl"
}, t);
function Demo() {
  const [t, setT] = React.useState('spec');
  const [v, setV] = React.useState('list');
  return React.createElement("div", {
    style: {
      display: 'flex',
      flexDirection: 'column',
      gap: 16
    }
  }, React.createElement(Tabs, {
    value: t,
    onChange: setT,
    tabs: [{
      value: 'spec',
      label: 'Thông số'
    }, {
      value: 'stock',
      label: 'Tồn kho',
      count: 4
    }, {
      value: 'alt',
      label: 'Mã thay thế'
    }]
  }), React.createElement("div", {
    style: {
      display: 'flex',
      gap: 12,
      alignItems: 'center',
      flexWrap: 'wrap'
    }
  }, React.createElement(Tabs, {
    variant: "pill",
    value: v === 'list' ? '7d' : '30d',
    onChange: x => setV(x === '7d' ? 'list' : 'grid'),
    tabs: [{
      value: '7d',
      label: '7 ngày'
    }, {
      value: '30d',
      label: '30 ngày'
    }]
  }), React.createElement(Tabs, {
    variant: "segmented",
    value: v,
    onChange: setV,
    tabs: [{
      value: 'list',
      label: 'Danh sách',
      icon: 'layers'
    }, {
      value: 'grid',
      label: 'Lưới',
      icon: 'box'
    }]
  })));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Demo, null));
</script>
</body>
</html>
