<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>TableToolbar — preview</title>
<style>body{margin:0;padding:20px;background:var(--bg-surface)}.lbl{font:var(--type-overline);color:var(--text-secondary);text-transform:uppercase;letter-spacing:var(--tracking-caps);margin-bottom:8px}</style>
</head>
<body>
<div id="root"></div>
<script>
const {
  TableToolbar,
  Button
} = window.AutoPartsAgentDesignSystem_aa8546;
const R = p => React.createElement("div", {
  style: {
    display: 'flex',
    gap: p.gap || 10,
    alignItems: p.align || 'center',
    flexWrap: 'wrap',
    ...p.style
  }
}, p.children);
const L = ({
  t
}) => React.createElement("div", {
  className: "lbl"
}, t);
function Demo() {
  const [f, setF] = React.useState([{
    key: 'b',
    label: 'Hãng: Toyota'
  }, {
    key: 'c',
    label: 'Danh mục: Phanh'
  }]);
  return React.createElement(TableToolbar, {
    search: {
      placeholder: 'Tìm SKU, tên sản phẩm…'
    },
    onAddFilter: () => {},
    filters: f,
    onRemoveFilter: k => setF(f.filter(x => x.key !== k)),
    onClearFilters: () => setF([]),
    actions: React.createElement(Button, {
      size: "sm",
      variant: "ghost",
      iconLeft: "download"
    }, "Xu\u1EA5t Excel")
  });
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Demo, null));
</script>
</body>
</html>
