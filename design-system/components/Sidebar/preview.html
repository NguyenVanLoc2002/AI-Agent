<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><title>Sidebar — preview</title>
<style>body{margin:0;padding:20px;background:var(--bg-surface)}.lbl{font:var(--type-overline);color:var(--text-secondary);text-transform:uppercase;letter-spacing:var(--tracking-caps);margin-bottom:8px}</style>
</head>
<body>
<div id="root"></div>
<script>
const {
  Sidebar
} = window.AutoPartsAgentDesignSystem_aa8546;
const R = p => React.createElement("div", {
  style: {
    display: 'flex',
    gap: p.gap || 10,
    alignItems: p.align || 'center',
    flexWrap: 'wrap',
    ...p.style
  }
}, p.children);
const L = ({
  t
}) => React.createElement("div", {
  className: "lbl"
}, t);
const sections = [{
  title: 'Tổng quan',
  items: [{
    key: 'dash',
    label: 'Bảng điều khiển',
    icon: 'layout-dashboard'
  }]
}, {
  title: 'Vận hành',
  items: [{
    key: 'lookup',
    label: 'Tra cứu phụ tùng',
    icon: 'search'
  }, {
    key: 'quote',
    label: 'Báo giá',
    icon: 'file-text',
    badge: 3
  }, {
    key: 'orders',
    label: 'Đơn hàng nháp',
    icon: 'clipboard-list'
  }, {
    key: 'ai',
    label: 'Trợ lý AI',
    icon: 'sparkles',
    badge: 'Mới',
    badgeTone: 'ai'
  }]
}, {
  title: 'Quản trị',
  items: [{
    key: 'audit',
    label: 'Hoạt động & kiểm toán',
    icon: 'history',
    locked: true
  }]
}];
function Demo() {
  const [c, setC] = React.useState(false);
  const [k, setK] = React.useState('lookup');
  return React.createElement("div", {
    style: {
      display: 'flex',
      height: 380,
      border: '1px solid var(--border-default)',
      borderRadius: 10,
      overflow: 'hidden',
      background: 'var(--bg-app)'
    }
  }, React.createElement(Sidebar, {
    sections: sections,
    activeKey: k,
    onSelect: setK,
    collapsed: c,
    onToggleCollapsed: () => setC(!c)
  }), React.createElement("div", {
    style: {
      flex: 1
    }
  }));
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Demo, null));
</script>
</body>
</html>
