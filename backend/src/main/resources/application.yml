# Base configuration shared by every profile.
# Security: no credentials or hostnames here. A non-local environment must supply APP_DB_URL,
# APP_DB_USERNAME and APP_DB_PASSWORD from a secret store; without them startup fails (fail-closed).
# No real Arito / Zalo / LLM provider configuration exists in POC-001 (A-05, D-01, D-06, D-07).
spring:
  application:
    name: secure-erp-agent
  # ADR-015 (ACCEPTED 2026-11-19): /api/demo/** exists only with profile demo; local includes demo.
  profiles:
    group:
      local: demo
  main:
    banner-mode: off
  # FE-DEPLOY (A-74, 1A): the built frontend is served from classpath:/static/ only (copied into the jar by the
  # Maven profile with-frontend; the default build removes it, so its jar serves no frontend). The default mapping
  # of every static file is off (review security L2): platform.internal.StaticResourceConfiguration maps only /,
  # /index.html and /assets/**. Which of them open without a session: identity.FrontendPaths.
  web:
    resources:
      add-mappings: false
      static-locations: classpath:/static/
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    log-request-details: false
  servlet:
    multipart:
      enabled: false

server:
  shutdown: graceful
  # ADR-010 (ACCEPTED): HttpOnly + Secure + SameSite=Lax session cookie; 30 min idle (the 8 h maximum
  # and a clock-driven idle check are enforced by identity's session filter as well).
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        secure: true
        same-site: lax
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-path: never
    whitelabel:
      enabled: false

# ADR-015: actuator exposes only health. Details hidden by default.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

# ADR-012: structured logs, no bodies. traceId comes from CorrelationIdFilter (MDC).
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    # EP-06 review: transaction/JDBC debug output can quote a failing row (prices, digests). Keep them
    # at INFO or above in every profile.
    org.springframework.transaction: INFO
    org.springframework.jdbc: INFO

# SEC-01a. A-05/ADR-004: Fake provider only, loopback address only (enforced at startup). No URL is
# configured by default, so every gateway call fails closed with PROVIDER_UNAVAILABLE until a local
# Fake provider is set via APAS_GATEWAY_PROVIDER_BASE_URL. Never put credentials here.
apas:
  # FE-DEPLOY (A-74, 4A): CSP upgrade-insecure-requests only when the server runs with TLS (profile tls).
  web:
    upgrade-insecure-requests: false
  gateway:
    provider:
      base-url: ${APAS_GATEWAY_PROVIDER_BASE_URL:}
      proxy: ${APAS_GATEWAY_PROVIDER_PROXY:}
      connect-timeout: 2s
      timeout:
        short: 5s
        standard: 15s
  # EP-03 tool limits: D-10 restrictive defaults APPROVED 2026-11-18 (TOOL_CONTRACTS §1).
  tools:
    limits:
      calls-per-turn: 3
      calls-per-conversation-per-hour: 20
      calls-per-principal-per-hour: 40
      conversations-per-principal-per-hour: 5
      max-depth: 3
      max-array-items: 20
      max-string-chars: 256
      rejections-before-handoff: 3
      product-ref-ttl: 2h
  # EP-04 / ADR-010: session limits (owner 2026-11-18, UX-12 part). Demo users only in profile demo.
  identity:
    idle-timeout: 30m
    absolute-timeout: 8h
  # EP-04 chat limits (DESIGN PROPOSAL): HTTP turns drive model calls, so they are bounded too.
  conversation:
    new-conversations-per-principal-per-hour: 5
    messages-per-conversation-per-hour: 30
    messages-per-principal-per-hour: 60
    max-request-bytes: 8192
    # An unanswered turn counts as running this long (409 meanwhile); a replay after it completes it as
    # handed off (EP-04 reviews).
    turn-timeout: 2m
  # EP-05: lifetime of a conversation's current VIN (owner decision 2026-11-18: 2 h, like a productRef).
  catalog:
    vin-ttl: 2h
  # EP-06 quotes (owner decisions 2026-11-18, ADR-014 / ADR-008): VND, scale 0, HALF_UP per line, 24 h.
  quote:
    currency: VND
    money-scale: 0
    rounding: HALF_UP
    validity: 24h
    # A-34 (owner 2026-11-18): no automatic quote for 24 h after a NOT_QUOTED; at most 5 quotes/conversation/h.
    lock-after-not-quoted: 24h
    max-issued-per-conversation-per-hour: 5
    # EP-07 (TH-26, DESIGN PROPOSAL): confirmation attempts per customer per rolling hour.
    confirmation:
      max-attempts-per-hour: 20
  # EP-07 / ADR-009 (ACCEPTED 2026-11-19): a draft order request not finished within this time is an
  # unknown outcome for staff; it is never sent again.
  order:
    submit-timeout: 2m
    # EP-09c (A-46 decision 2A): background sweep of unfinished requests; every instance sweeps (a conditional
    # update per request makes it safe), the read paths still sweep as a safety net.
    sweeper:
      enabled: true
      interval: PT30S
  # ADR-009: what the target ERP supports is static configuration taken from approved ERP API
  # documentation, never reported by the adapter. Both are OPEN (D-03), so both stay false: no
  # idempotency key is forwarded, no lookup is made, every unknown outcome goes to staff.
  erp:
    capabilities:
      supports-idempotency-key: false
      supports-external-ref-lookup: false
# apas.erp.mock.fault-mode is deliberately absent from shared configuration (default NONE in code);
# fault injection is set only by tests (architecture review M6).
