# Base configuration shared by every profile.
# Security: no credentials or hostnames here. A non-local environment must supply APP_DB_URL,
# APP_DB_USERNAME and APP_DB_PASSWORD from a secret store; without them startup fails (fail-closed).
# No real Arito / Zalo / LLM provider configuration exists in POC-001 (A-05, D-01, D-06, D-07).
spring:
  application:
    name: secure-erp-agent
  main:
    banner-mode: off
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    log-request-details: false
  servlet:
    multipart:
      enabled: false

server:
  shutdown: graceful
  max-http-request-header-size: 16KB
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    include-path: never
    whitelabel:
      enabled: false

# ADR-015: actuator exposes only health. Details hidden by default.
management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

# ADR-012: structured logs, no bodies. traceId comes from CorrelationIdFilter (MDC).
logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
